<svg viewBox="0 0 740 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative mock of the costgate PR comment: a cost-diff table per model with a failing gate verdict">
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #656d76; }
    .strong { fill: #1f2328; font-weight: 600; }
    .num { fill: #1f2328; }
    .up { fill: #cf222e; }
    .zero { fill: #656d76; }
  </style>

  <!-- Card -->
  <rect x="1" y="1" width="738" height="348" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Header -->
  <path d="M1 9 a8 8 0 0 1 8 -8 h722 a8 8 0 0 1 8 8 v39 h-738 z" fill="#f6f8fa"/>
  <line x1="1" y1="48" x2="739" y2="48" stroke="#d0d7de"/>
  <circle cx="28" cy="24" r="12" fill="#1a7f37"/>
  <text class="mono" x="28" y="28" font-size="10" fill="#ffffff" text-anchor="middle">cg</text>
  <text class="sans strong" x="48" y="28" font-size="13">costgate</text>
  <rect x="112" y="15" width="30" height="17" rx="8.5" fill="none" stroke="#d0d7de"/>
  <text class="sans muted" x="127" y="27" font-size="10" text-anchor="middle">bot</text>
  <text class="sans muted" x="150" y="28" font-size="12">commented 1 minute ago</text>
  <rect x="586" y="13" width="140" height="22" rx="11" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="sans" x="656" y="28" font-size="10.5" fill="#7d4e00" text-anchor="middle" font-weight="600">ILLUSTRATIVE MOCK</text>

  <!-- Body title -->
  <text class="sans strong" x="24" y="78" font-size="14">&#128184; Cost impact of this pull request &#8212; 3 models changed</text>

  <!-- Table header -->
  <text class="sans muted" x="24" y="108" font-size="11.5" font-weight="600">Model</text>
  <text class="sans muted" x="330" y="108" font-size="11.5" font-weight="600" text-anchor="end">Baseline</text>
  <text class="sans muted" x="445" y="108" font-size="11.5" font-weight="600" text-anchor="end">This PR</text>
  <text class="sans muted" x="565" y="108" font-size="11.5" font-weight="600" text-anchor="end">&#916; per run</text>
  <text class="sans muted" x="716" y="108" font-size="11.5" font-weight="600" text-anchor="end">&#916; per month (est.)</text>
  <line x1="24" y1="118" x2="716" y2="118" stroke="#d0d7de"/>

  <!-- Row 1 -->
  <text class="mono" x="24" y="140" font-size="12" fill="#0969da">fct_orders_daily</text>
  <text class="mono num" x="330" y="140" font-size="12" text-anchor="end">68.2 MiB</text>
  <text class="mono num" x="445" y="140" font-size="12" text-anchor="end">2.91 TiB</text>
  <text class="mono up" x="565" y="140" font-size="12" text-anchor="end" font-weight="700">+$18.16</text>
  <text class="mono up" x="716" y="140" font-size="12" text-anchor="end" font-weight="700">+$544.80</text>
  <line x1="24" y1="152" x2="716" y2="152" stroke="#eaeef2"/>

  <!-- Row 2 -->
  <text class="mono" x="24" y="174" font-size="12" fill="#0969da">dim_customers <tspan class="sans muted" font-size="11">(new)</tspan></text>
  <text class="mono zero" x="330" y="174" font-size="12" text-anchor="end">&#8212;</text>
  <text class="mono num" x="445" y="174" font-size="12" text-anchor="end">412.5 MiB</text>
  <text class="mono num" x="565" y="174" font-size="12" text-anchor="end">+$0.003</text>
  <text class="mono num" x="716" y="174" font-size="12" text-anchor="end">+$0.08</text>
  <line x1="24" y1="186" x2="716" y2="186" stroke="#eaeef2"/>

  <!-- Row 3 -->
  <text class="mono" x="24" y="208" font-size="12" fill="#0969da">stg_payments</text>
  <text class="mono num" x="330" y="208" font-size="12" text-anchor="end">1.10 GiB</text>
  <text class="mono num" x="445" y="208" font-size="12" text-anchor="end">1.10 GiB</text>
  <text class="mono zero" x="565" y="208" font-size="12" text-anchor="end">$0.00</text>
  <text class="mono zero" x="716" y="208" font-size="12" text-anchor="end">&#8212;</text>

  <!-- Verdict banner -->
  <rect x="24" y="228" width="692" height="34" rx="6" fill="#ffebe9" stroke="#ff8182"/>
  <text class="sans" x="38" y="250" font-size="12.5" fill="#cf222e" font-weight="600">&#10060; Gate: FAIL &#8212; fct_orders_daily exceeds max increase per run ($5.00)</text>

  <!-- Footer -->
  <text class="sans muted" x="24" y="290" font-size="11">Region US (multi-region) &#183; on-demand $6.25/TiB &#183; pricing table 2026.07 (built-in) &#183; frequency: 30 runs/month</text>
  <text class="sans muted" x="24" y="310" font-size="11">Estimates from BigQuery dry-run &#8212; nothing was executed, no bytes were billed. Compiled SQL is never shown.</text>
  <line x1="24" y1="324" x2="716" y2="324" stroke="#eaeef2"/>
  <text class="sans muted" x="24" y="340" font-size="10.5" font-style="italic">Mock of the target design &#8212; produced before implementation; format may change.</text>
</svg>
