<svg viewBox="0 0 930 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="costgate flow: pull request, compile both versions, BigQuery dry-run, price the diff, gate">
  <style>
    .card { fill: #24292f; stroke: #444c56; stroke-width: 1; }
    .title { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .sub { font: 400 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9ea7b3; }
    .arrow { stroke: #768390; stroke-width: 1.6; fill: none; }
    .head { fill: #768390; }
  </style>

  <!-- 1. Pull request -->
  <rect class="card" x="10" y="34" width="150" height="92" rx="8"/>
  <rect x="10" y="34" width="150" height="4" rx="2" fill="#6cb6ff"/>
  <text class="title" x="85" y="66" text-anchor="middle">Pull request</text>
  <text class="sub" x="85" y="86" text-anchor="middle">dbt model SQL
    <tspan x="85" dy="14">changes</tspan></text>

  <!-- arrow -->
  <line class="arrow" x1="164" y1="80" x2="192" y2="80"/>
  <polygon class="head" points="192,75 200,80 192,85"/>

  <!-- 2. Compile -->
  <rect class="card" x="200" y="34" width="150" height="92" rx="8"/>
  <rect x="200" y="34" width="150" height="4" rx="2" fill="#b083f0"/>
  <text class="title" x="275" y="66" text-anchor="middle">Compile &#215;2</text>
  <text class="sub" x="275" y="86" text-anchor="middle">baseline + PR versions
    <tspan x="275" dy="14">via state:modified</tspan></text>

  <!-- arrow -->
  <line class="arrow" x1="354" y1="80" x2="382" y2="80"/>
  <polygon class="head" points="382,75 390,80 382,85"/>

  <!-- 3. Dry-run -->
  <rect class="card" x="390" y="34" width="150" height="92" rx="8"/>
  <rect x="390" y="34" width="150" height="4" rx="2" fill="#57ab5a"/>
  <text class="title" x="465" y="66" text-anchor="middle">BigQuery dry-run</text>
  <text class="sub" x="465" y="86" text-anchor="middle">exact bytes scanned
    <tspan x="465" dy="14">free &#183; executes nothing</tspan></text>

  <!-- arrow -->
  <line class="arrow" x1="544" y1="80" x2="572" y2="80"/>
  <polygon class="head" points="572,75 580,80 572,85"/>

  <!-- 4. Price -->
  <rect class="card" x="580" y="34" width="150" height="92" rx="8"/>
  <rect x="580" y="34" width="150" height="4" rx="2" fill="#daaa3f"/>
  <text class="title" x="655" y="66" text-anchor="middle">Price the diff</text>
  <text class="sub" x="655" y="86" text-anchor="middle">region-aware $/TiB
    <tspan x="655" dy="14">$/run &#183; est. $/month</tspan></text>

  <!-- arrow -->
  <line class="arrow" x1="734" y1="80" x2="762" y2="80"/>
  <polygon class="head" points="762,75 770,80 762,85"/>

  <!-- 5. Gate -->
  <rect class="card" x="770" y="34" width="150" height="92" rx="8"/>
  <rect x="770" y="34" width="150" height="4" rx="2" fill="#e5534b"/>
  <text class="title" x="845" y="66" text-anchor="middle">Gate</text>
  <text class="sub" x="845" y="86" text-anchor="middle">PR comment &#183; JSON
    <tspan x="845" dy="14">pass / warn / fail</tspan></text>
</svg>
