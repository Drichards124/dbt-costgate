<svg viewBox="0 0 96 96" width="96" height="96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dbt-costgate logo: a gate with a dollar sign">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#116329"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- gate crossbar -->
  <rect x="18" y="20" width="60" height="9" rx="4.5" fill="#ffffff"/>
  <!-- gate pillars -->
  <rect x="26" y="27" width="9" height="49" rx="4.5" fill="#ffffff" opacity="0.95"/>
  <rect x="61" y="27" width="9" height="49" rx="4.5" fill="#ffffff" opacity="0.95"/>
  <!-- the dollar passing the gate -->
  <text x="48" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">$</text>
</svg>
