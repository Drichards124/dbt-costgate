version: 2
updates:
  # Runtime dependencies are deliberately minimal (see SECURITY.md — this tool
  # runs next to warehouse credentials). Updates target `ple` so they pass the
  # production-like gate before reaching `main`, like any change.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # The container image's base is a dependency like any other, and it is the one
  # nobody thinks to look at. Without this it would be the only dependency here
  # that nothing watches.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
