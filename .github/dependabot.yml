version: 2
updates:
  # Runtime dependencies are deliberately minimal (see SECURITY.md — this tool
  # runs next to warehouse credentials). Updates target `ple` so they pass the
  # production-like gate before reaching `main`, like any change.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # The container image's base is a dependency like any other, and it is the one
  # nobody thinks to look at. Without this it would be the only dependency here
  # that nothing watches.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "ple"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    ignore:
      # The image must run a Python the CI matrix covers, which
      # tests/test_container_image.py enforces. A bump past the matrix therefore
      # fails by design, and reopening that pull request weekly is noise.
      #
      # This floor is not a decision about 3.14 — it is a restatement of where
      # the matrix currently ends, and the same test asserts the two agree. Add a
      # version to ci.yml and the suite tells you to raise this line, so the rule
      # cannot quietly outlive its reason.
      - dependency-name: "python"
        versions: [">=3.14"]
