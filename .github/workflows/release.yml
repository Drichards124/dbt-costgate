# SPDX-License-Identifier: Apache-2.0
name: Release

# Cut a GitHub Release when a vX.Y.Z tag is pushed to main. Builds the wheel and
# sdist, checksums them, smoke-tests the built wheel, and publishes a Release with
# those artifacts and the CHANGELOG section for the version. No PyPI publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # only to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/dbt_costgate/__init__.py').read_text()).group(1))")"
          if [ "$version" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME (version $version) does not match package version $pkg."
            exit 1
          fi
          echo "Tag matches package version $pkg."

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Checksum the artifacts
        run: |
          ( cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Install the built wheel into a clean environment and verify it
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/dbt-costgate --version
          got="$(/tmp/smoke/bin/python -c "import dbt_costgate; print(dbt_costgate.__version__)")"
          if [ "$got" != "$version" ]; then
            echo "Installed wheel reports version $got, expected $version."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || { echo "no CHANGELOG section for $version"; exit 1; }
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dbt-costgate $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

      # Hand the distributions to the publish job. SHA256SUMS is deliberately not
      # included: PyPI rejects anything in the upload directory that isn't a
      # distribution, and it belongs to the GitHub Release, not to PyPI.
      # Note: do NOT set `archive: false` here. That mode uploads a single file
      # unzipped, ignores `name`, and fails outright on a glob matching more than
      # one file — and this step deliberately uploads two (wheel and sdist).
      - name: Upload distributions for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # Publishing runs only after the GitHub Release exists, so a PyPI outage leaves
  # a complete, downloadable release behind rather than nothing at all.
  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing (OIDC): GitHub mints a short-lived identity token that
    # PyPI verifies against the registered publisher. There is no API token to
    # store, rotate, or leak. Declared here rather than at the top of the file so
    # only this job can request it — and note that a job-level block replaces the
    # workflow default, so this job deliberately has no `contents: write`.
    permissions:
      id-token: write
    steps:
      # v8 errors on a digest mismatch rather than warning, which is what we want
      # on the publish path: a corrupted distribution should fail the run, not
      # reach PyPI.
      - name: Download the distributions built above
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Publishing to the Marketplace is a UI action that CI cannot perform, so the
      # best it can do is make forgetting loud at the moment it is actionable.
      - name: Remaining manual step
        run: |
          {
            echo "### One manual step left: the Marketplace listing"
            echo ""
            echo "The listing does **not** follow releases. It stays at whichever release"
            echo "last had the box ticked, advertising old code with nothing reporting it."
            echo ""
            echo "1. Open <https://github.com/${GITHUB_REPOSITORY}/releases/edit/${GITHUB_REF_NAME}>"
            echo "2. Tick **Publish this Action to the GitHub Marketplace**"
            echo "3. **Update release**"
            echo ""
            echo "Edit the existing release — do not use the repository banner's"
            echo "\"Draft a release\" button. That creates a *new* release, and publishing"
            echo "it against a fresh tag fires this workflow twice into a hard failure:"
            echo "the tag will not match __version__, and there is no CHANGELOG section"
            echo "for it."
            echo ""
            echo "The **Marketplace drift** workflow fails every Monday until this is done."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing the container image is off until the repository variable
  # PUBLISH_IMAGE is set to "true". The image itself is built and smoke-tested on
  # every push to `ple`, so this switch governs only whether a release pushes it
  # to ghcr.io — turning it on is a deliberate decision, not something a tag
  # does by surprise. Note that a job-level permissions block replaces the
  # workflow default, so this job deliberately has no `contents: write`.
  image:
    name: Publish the container image
    needs: release
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the source the image is built from
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Build the image for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .

      - name: The image must report the version being released
        run: |
          version="${GITHUB_REF_NAME#v}"
          got="$(docker run --rm "$IMAGE:$GITHUB_REF_NAME" --version)"
          if [ "$got" != "dbt-costgate $version" ]; then
            echo "Image reports '$got', this release is $version — refusing to push."
            exit 1
          fi

      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"

      # A package pushed to ghcr.io under a user account is created *private*, and
      # nothing in this workflow can change that — `docker pull` fails for
      # everyone until a human flips it. That is a one-time step, so this asks
      # the API instead of nagging on every release: a reminder that prints
      # forever is one people learn to scroll past. An unanswerable question is
      # treated as "not public", because assuming otherwise is the failure this
      # step exists to catch.
      - name: Check the pushed image is actually pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          pkg="${GITHUB_REPOSITORY#*/}"
          # `gh api` prints its error JSON on stdout, so the assignment has to be
          # overwritten on failure rather than appended to — otherwise a 404 body
          # ends up in the message below.
          visibility="$(gh api "users/$owner/packages/container/$pkg" --jq .visibility 2>/dev/null)" || visibility=unknown
          if [ "$visibility" = "public" ]; then
            echo "Container package is public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### One manual step left: the container package is not public"
            echo ""
            echo "Its visibility reads \`$visibility\`. A package pushed to ghcr.io under a"
            echo "user account is created private, and this workflow cannot change that —"
            echo "\`docker pull $IMAGE\` fails for everyone until you do."
            echo ""
            echo "1. Open <https://github.com/users/$owner/packages/container/$pkg/settings>"
            echo "2. **Change visibility** → Public"
            echo ""
            echo "Linking to this repository needs nothing: the image already carries the"
            echo "\`org.opencontainers.image.source\` label."
          } >> "$GITHUB_STEP_SUMMARY"
