# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-costgate"
dynamic = ["version"]
description = "BigQuery cost gate for dbt pull requests: dry-run changed models, diff the bytes, price the damage before it merges."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Dashan Richards" }]
keywords = ["bigquery", "dbt", "finops", "cost", "dry-run", "ci", "analytics-engineering"]
# PyPI renders these on the listing page, above the README — for a lot of people
# they are the first thing read about this project. `tests/test_packaging_metadata.py`
# checks the two that go stale in silence: the Development Status, which sat at
# Pre-Alpha through every 1.x release, and the Python versions, which have to keep
# matching the range CI actually tests.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]
dependencies = [
    "google-cloud-bigquery>=3.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Drichards124/dbt-costgate"
Repository = "https://github.com/Drichards124/dbt-costgate"
Issues = "https://github.com/Drichards124/dbt-costgate/issues"
Changelog = "https://github.com/Drichards124/dbt-costgate/blob/main/CHANGELOG.md"

[project.scripts]
dbt-costgate = "dbt_costgate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.hatch.version]
path = "src/dbt_costgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_costgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# `S` is flake8-bandit. This project runs in CI next to warehouse credentials
# (see SECURITY.md), so static security linting earns its keep. The rules that
# actually matter stay on everywhere — S602 (shell=True) in particular is never
# suppressed anywhere in this file, and a test asserts that it still fires.
select = ["E", "F", "I", "UP", "B", "S"]

# Suppressed only in the test tree, and only per-rule:
#   S101 — `assert` is how pytest expresses every test.
#   S603/S607 — helpers shell out to git and bash to build fixtures.
#   S105/S608 — deliberate fake secrets and fake SQL, which is the point of the
#               fixtures that carry them (see tests/test_error_redaction.py).
# Source suppressions are per-line with a reason at the call site instead.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S105", "S608"]
# `scripts/verify_live.py` is a test harness that happens to live outside tests/.
#   S608 — it builds malformed SQL deliberately, so BigQuery will reject it and
#          the rejection can be classified. Broken SQL is the fixture.
#   S603 — it runs this repo's own CLI as a subprocess, on arguments it builds
#          itself. S602 (shell=True) is not suppressed here or anywhere.
"scripts/verify_live.py" = ["S603", "S608"]
